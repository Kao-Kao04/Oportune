name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the build can run; CI never talks to Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # Surface npm errors as an annotation (visible without opening the log).
        run: |
          set +e
          npm ci --no-audit --no-fund 2>&1 | tee npm-ci.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=npm ci failed::$(grep -E 'npm (error|ERR)' npm-ci.log | tail -25 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit "$status"
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
